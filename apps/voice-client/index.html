<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alfred // uplink</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="grid-bg" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <header class="top">
      <div class="brand">
        <span class="brand-mark">ALFRED</span>
        <span class="brand-sub">UPLINK // VOICE</span>
      </div>
      <div class="link-state">
        <span id="link-dot" class="dot"></span>
        <span id="status">OFFLINE</span>
      </div>
    </header>

    <section class="stage">
      <div id="user-panel" class="user-panel">
        <div class="user-meta">
          <span class="user-tag">YOU // MIC</span>
          <span id="user-mode">IDLE</span>
        </div>
        <p id="user-caption" class="user-caption">
          <span id="user-text" class="placeholder">Speak to uplink…</span
          ><span id="user-cursor" class="cursor user-cursor" hidden></span>
        </p>
      </div>

      <canvas id="wave" width="1400" height="420" aria-label="Live speech waveform"></canvas>
      <div class="hud-ring" aria-hidden="true"></div>

      <div class="readout">
        <div class="readout-meta">
          <span class="alfred-tag">ALFRED // OUT</span>
          <span>
            <span id="mode-tag">STANDBY</span>
            ·
            <span id="level-tag">LVL --</span>
          </span>
        </div>
        <p id="caption" class="caption">
          <span id="caption-live"></span><span id="caption-rest" class="caption-rest"></span
          ><span id="cursor" class="cursor" hidden></span>
        </p>
      </div>
    </section>

    <footer class="bottom">
      <div class="actions">
        <button id="connect" type="button">ENGAGE</button>
        <button id="disconnect" type="button" disabled>TERMINATE</button>
      </div>
      <p id="meta" class="meta"></p>
    </footer>

    <div id="remote-audio" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
