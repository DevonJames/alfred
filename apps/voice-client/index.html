<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alfred voice client</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main>
      <h1>Alfred</h1>
      <p class="sub">Local mic client with WebRTC echo cancellation</p>
      <p id="status" class="status">Disconnected</p>
      <div class="actions">
        <button id="connect" type="button">Connect</button>
        <button id="disconnect" type="button" disabled>Disconnect</button>
      </div>
      <p id="meta" class="meta"></p>
    </main>
    <div id="remote-audio" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
